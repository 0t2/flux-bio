<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light" />
		<title>FluxBio</title>
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
		/>
		<!--
			The Chinese font comes cut into over a hundred files, and its stylesheet is the list of them: 35 KB compressed
			against 1 KB for the three families above. So it isn't one the page waits for. As a print stylesheet it is fetched
			without holding up the first paint or the script, and src/admin/main.tsx turns it on (an attribute couldn't: the
			dashboard's CSP allows no inline script). Asking for the weights as one range lists each file once, where
			400;500;700 listed each three times.
		-->
		<link
			rel="stylesheet"
			media="print"
			data-late
			href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..700&display=swap"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/admin/main.tsx"></script>
	</body>
</html>
