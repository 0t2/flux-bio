# pnpm's settings for this project. Since pnpm 11 they live here, not in package.json.

# The packages that may run a script when they are installed: both fetch the program they wrap for this computer.
# pnpm runs no other package's install script, and stops if one asks to.
allowBuilds:
  esbuild: true
  workerd: true

# pnpm doesn't pick a version published in the last 24 hours. These two were named exactly on 2026-11-06, when they
# were 21 and 15 hours old, so pnpm took them and wrote them down here. Each entry is one version and means nothing
# once that version is a day old: take the list out at the next update.
minimumReleaseAgeExclude:
  - cf@1.0.0-beta.28
  - playwright-core@1.65.0
