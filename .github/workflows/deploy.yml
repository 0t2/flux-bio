name: Test and deploy

# Every pull request and push runs the type check and the tests, and builds the
# landing page. A push to main in the maintainer's repository then deploys;
# forks never do. The landing page always goes out, since it uses the product's
# themes. A FluxBio site goes out too only when the repository names one in its
# FLUXBIO_SITE variable, and then only when something it is built from or deployed
# with changed: not for the landing page, the docs, the tests or the scripts that
# only help develop it. A push that brought a new version (package.json, which the
# tests hold to the newest heading in CHANGELOG.md) is then tagged v<version>, with
# that section of the changelog as the notes of its GitHub release.

on:
  pull_request:
  push:
    branches: [main]

# Deploying uses the Cloudflare token, not GitHub's: the workflow only reads the repository, except the
# release job, which may write to it so that it can make the tag.
permissions:
  contents: read

# Pushes to main deploy one at a time, in the order they came: two runs side by side could finish the wrong way round
# and leave fluxbio.link at the older commit, or both try to tag one release. A push that arrives while one is
# running waits, and takes the place of any that was already waiting, which is why the release job below looks for
# every version without a tag and not only its own. A pull request's newer push replaces its older run.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm landing
      # A release is dated the day it reaches main: today in Taipei, where the project is kept, or by UTC, which is
      # what a cloud session's clock says. This runs when the pull request is pushed to, so one that waits overnight
      # still has to have its date changed before it is merged.
      - if: github.event_name == 'pull_request'
        run: |
          number='s/^[[:space:]]*"version": "([0-9]+\.[0-9]+\.[0-9]+)",?$/\1/p'
          version=$(sed -nE "$number" package.json | head -n 1)
          # What this is checked out as is the merge into main as main is now: its first parent, where there are two.
          # The base the pull request was opened against may be older than that.
          if git rev-parse -q --verify HEAD^2 > /dev/null; then BASE=$(git rev-parse HEAD^1); fi
          before=$(git show "$BASE:package.json" | sed -nE "$number" | head -n 1)
          [ "$version" != "$before" ] || exit 0
          dated=$(awk -v version="$version" '/^## / && $2 == version { print $4 }' CHANGELOG.md)
          below=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+ - / { if (++n == 2) { print $4; exit } }' CHANGELOG.md)
          utc=$(date -u +%F)
          taipei=$(TZ=Asia/Taipei date +%F)
          if [ "$dated" != "$utc" ] && [ "$dated" != "$taipei" ]; then
            echo "::error file=CHANGELOG.md::$version is dated $dated, and today is $taipei. Change the date in CHANGELOG.md and in the 12 files under landing/changelog/."
            exit 1
          fi
          # Either of today's two dates passes above, but a release can't be dated before the one under it, which
          # the tests then refuse in other words. For eight hours a day the two differ, and only the later one fits.
          if [ -n "$below" ] && [ "$dated" \< "$below" ]; then
            echo "::error file=CHANGELOG.md::$version is dated $dated, before the release under it ($below). Date it $taipei, in CHANGELOG.md and in the 12 files under landing/changelog/."
            exit 1
          fi
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      # The Workers keep their own secrets, so deploys don't pass a secrets file. The token
      # reaches one account only, so cf needs no account id.
      # Without the FLUXBIO_SITE variable no FluxBio site is deployed: `cf deploy` would make a new
      # Worker, database and KV namespace on the account, and stop for want of its password.
      # With a full token, the site's pictures go out as static files (pnpm deploy:images).
      # FLUXBIO_SITE_TOKENS supplies per-site credentials on a shared Worker. Images are downloaded
      # afresh each time, never cached: an Actions cache in a public repository can be read by pull
      # requests from forks. If that fails, or there is no token, the deploy goes out without them.
      - if: github.event_name == 'push' && github.repository == '0t2/flux-bio'
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}") || changed=unknown
          product=$(printf '%s\n' "$changed" | grep -vE '^(landing/|docs/|tests/|scripts/|\.claude/|[^/]+\.md$|themes/README\.md$|LICENSE$|\.gitignore$)' || true)
          # The scripts a deploy runs.
          deployer=$(printf '%s\n' "$changed" | grep -E '^scripts/deploy(-images|-check)?\.mjs$' || true)
          if [ -n "$FLUXBIO_SITE" ] && [ -n "$product$deployer" ]; then
            if [ -n "$FLUXBIO_TOKEN$FLUXBIO_SITE_TOKENS" ]; then
              pnpm deploy:images --site "$FLUXBIO_SITE" || pnpm run deploy
            else
              pnpm run deploy
            fi
          fi
          # The Traditional Chinese page's font, cut to the characters it shows now. Without it the page links Google's.
          pnpm landing:fonts || echo "The landing page goes out with Noto Sans TC from Google Fonts."
          pnpm landing:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLUXBIO_TOKEN: ${{ secrets.FLUXBIO_TOKEN }}
          FLUXBIO_SITE_TOKENS: ${{ secrets.FLUXBIO_SITE_TOKENS }}
          FLUXBIO_SITE: ${{ vars.FLUXBIO_SITE }}
          # The other sites the Worker holds, as sites.json would list them: a checkout has no such file, and a deploy
          # without the list would unbind them (cloudflare.config.ts).
          FLUXBIO_SITES: ${{ vars.FLUXBIO_SITES }}
          # And the Worker's own name and domains, as worker.json would say them.
          FLUXBIO_WORKER: ${{ vars.FLUXBIO_WORKER }}

  # After the tests and the deploy, so a version that never worked gets no tag. A push without a new version, which
  # is any change that needed no changelog entry, finds its tag already there and does nothing.
  #
  # It tags every release that has none, not only the one this push brought: a run that failed after its tests, or
  # one that never started because a newer push took its place in the queue, would otherwise leave its version
  # without a tag for good, and whoever watches the repository's releases would never hear of it. Each tag goes on
  # the commit that first carried that version, oldest first, so the newest is the one GitHub calls latest.
  release:
    needs: test-and-deploy
    if: github.event_name == 'push' && github.repository == '0t2/flux-bio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag: which commit first carried a version is read from the history.
          fetch-depth: 0
      - run: bash scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
