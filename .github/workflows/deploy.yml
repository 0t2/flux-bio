name: Test and deploy

# Every pull request and push runs the type check and the tests, and builds the
# landing page. A push to main in the maintainer's repository then deploys;
# forks never do. The landing page always goes out, since it uses the product's
# themes. A FluxBio site goes out too only when the repository names one in its
# FLUXBIO_SITE variable, and then only when something it is built from or deployed
# with changed: not for the landing page, the docs, the tests or the scripts that
# only help develop it.

on:
  pull_request:
  push:
    branches: [main]

# Deploying uses the Cloudflare token, not GitHub's: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm landing
      # The Workers keep their own secrets, so deploys don't pass a secrets file. The token
      # reaches one account only, so cf needs no account id.
      # Without the FLUXBIO_SITE variable no FluxBio site is deployed: `cf deploy` would make a new
      # Worker, database and KV namespace on the account, and stop for want of its password.
      # With a full token, the site's pictures go out as static files (pnpm deploy:images).
      # FLUXBIO_SITE_TOKENS supplies per-site credentials on a shared Worker. Images are downloaded
      # afresh each time, never cached: an Actions cache in a public repository can be read by pull
      # requests from forks. If that fails, or there is no token, the deploy goes out without them.
      - if: github.event_name == 'push' && github.repository == '0t2/flux-bio'
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}") || changed=unknown
          product=$(printf '%s\n' "$changed" | grep -vE '^(landing/|docs/|tests/|scripts/|\.claude/|[^/]+\.md$|themes/README\.md$|LICENSE$|\.gitignore$)' || true)
          # The one script a deploy runs.
          deployer=$(printf '%s\n' "$changed" | grep -E '^scripts/deploy-images\.mjs$' || true)
          if [ -n "$FLUXBIO_SITE" ] && [ -n "$product$deployer" ]; then
            if [ -n "$FLUXBIO_TOKEN$FLUXBIO_SITE_TOKENS" ]; then
              pnpm deploy:images --site "$FLUXBIO_SITE" || pnpm exec cf deploy
            else
              pnpm exec cf deploy
            fi
          fi
          # The Traditional Chinese page's font, cut to the characters it shows now. Without it the page links Google's.
          pnpm landing:fonts || echo "The landing page goes out with Noto Sans TC from Google Fonts."
          pnpm landing:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLUXBIO_TOKEN: ${{ secrets.FLUXBIO_TOKEN }}
          FLUXBIO_SITE_TOKENS: ${{ secrets.FLUXBIO_SITE_TOKENS }}
          FLUXBIO_SITE: ${{ vars.FLUXBIO_SITE }}
          # The other sites the Worker holds, as sites.json would list them: a checkout has no such file, and a deploy
          # without the list would unbind them (cloudflare.config.ts).
          FLUXBIO_SITES: ${{ vars.FLUXBIO_SITES }}
